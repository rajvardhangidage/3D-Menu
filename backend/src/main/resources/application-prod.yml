spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
server:
  shutdown: graceful
logging:
  level:
    root: INFO
    com.immersivemenu: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
